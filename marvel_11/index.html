<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Student Task Planner</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </header>

    <form id="task-form" class="task-form">
      <label class="field">
        <span>Judul tugas</span>
        <input id="task-title" type="text" placeholder="Contoh: Laporan Praktikum Fisika" required>
      </label>
      <label class="field">
        <span>Tenggat</span>
        <input id="task-due" type="date" required>
      </label>
      <button type="submit" class="btn-primary">Tambah tugas</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tugas">
      <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">Semua</button>
      <button type="button" class="filter" data-filter="pending" aria-pressed="false">Belum selesai</button>
      <button type="button" class="filter" data-filter="completed" aria-pressed="false">Selesai</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
